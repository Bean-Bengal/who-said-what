      if (pts.length) { root.appendChild(svg('path', { d: 'M' + pts.map(function (p) { return p.join(','); }).join('L') + 'L' + pts[pts.length - 1][0] + ',' + (f.H - f.pad.b) + 'L' + pts[0][0] + ',' + (f.H - f.pad.b) + 'Z', fill: f.color, opacity: 0.12 })); root.appendChild(svg('path', { d: 'M' + pts.map(function (p) { return p.join(','); }).join('L'), fill: 'none', stroke: f.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' })); }
      pts.forEach(function (p, i) { root.appendChild(svg('circle', { cx: p[0], cy: p[1], r: 4.5, fill: 'var(--k-surface)', stroke: f.color, 'stroke-width': 2.5 })); root.appendChild(svg('text', { x: p[0], y: f.H - 6, 'text-anchor': i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle' }, [String(data[i].label)])); });
    });
  };

  // ---- Little sounds --------------------------------------------------------------------------
  var ac = null;
  function tone(freq, dur, type, vol, slide) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  K.sound = { tone: tone, tap: function () { tone(660, 0.06, 'triangle', 0.08); }, ok: function () { tone(523, 0.09, 'triangle'); setTimeout(function () { tone(784, 0.14, 'triangle'); }, 80); }, no: function () { tone(220, 0.18, 'sawtooth', 0.08, 140); }, pop: function () { tone(900, 0.07, 'sine', 0.12, 300); } };

  // ---- Small helpers ----------------------------------------------------------------------------
  K.uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  K.when = function (ts) { var d = new Date(ts), m = Math.round((Date.now() - ts) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); };
  K.money = function (n, cur) { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur || 'EUR' }).format(n); } catch (e) { return '€' + Number(n).toFixed(2); } };
  K.shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  K.pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };
  K.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
})();
